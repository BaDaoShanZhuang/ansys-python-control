[project]
name = "ansys-python-control"
version = "0.1.0"
description = "Local desktop automation helpers for Ansys Mechanical database workflows."
requires-python = ">=3.10,<3.12"
dependencies = [
  "ansys-mechanical-core",
  "PySide6",
]

[project.scripts]
ansys-control-app = "ansys_control.gui:main"

[tool.setuptools]
packages = ["ansys_control"]
